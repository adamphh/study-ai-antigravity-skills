<header>Chuyên Đề: Giải Phẫu Chi Phí Token &amp; Kiến Trúc Tối Ưu Cho AI Agent</header>
<h2 id="%E2%9D%93-slide-3-hi%E1%BB%83u-l%E1%BA%A7m-tai-h%E1%BA%A1i-v%E1%BB%81-c%C3%A1ch-t%C3%ADnh-token"><img class="emoji" draggable="false" alt="❓" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/2753.svg" data-marp-twemoji=""/> Slide 3: Hiểu Lầm Tai Hại Về Cách Tính Token</h2>
<p>Hầu hết lập trình viên khi mới dùng AI Agent thường có một giả định sai lầm:</p>
<blockquote>
<p><em>&quot;Tôi chỉ hỏi AI một câu: 'Hãy commit code giúp tôi'. Câu đó chỉ có 7 từ, cùng lắm AI trả về 20 từ. Tại sao dashboard lại báo mất tới <strong>80.000 tokens</strong>?&quot;</em></p>
</blockquote>
<h3 id="th%E1%BB%B1c-t%E1%BA%BF-ph%C3%ADa-sau">Thực Tế Phía Sau:</h3>
<ul>
<li>AI Agent <strong>không có bộ nhớ dài hạn độc lập</strong> như con người.</li>
<li>Để AI có thể &quot;nhớ&quot; được bạn đang làm task gì, sửa file nào, container nào đang chạy... mỗi khi bạn gửi 1 câu hỏi, hệ thống phải <strong>đóng gói lại toàn bộ quá khứ</strong> và gửi lên máy chủ AI.</li>
</ul>

<h3 id="h%E1%BA%ADu-qu%E1%BA%A3-v%E1%BB%81-chi-ph%C3%AD">Hậu quả về chi phí:</h3>

<header>Chuyên Đề: Giải Phẫu Chi Phí Token &amp; Kiến Trúc Tối Ưu Cho AI Agent</header>
<h2 id="%F0%9F%92%A3-slide-8-t%E1%BB%99i-%C4%91%E1%BB%93-2--l%E1%BA%A1m-d%E1%BB%A5ng-subagent-%C4%91%E1%BB%83-%C4%91%E1%BA%BFm-k%C3%BD-t%E1%BB%B1"><img class="emoji" draggable="false" alt="💣" src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@17.0.3/assets/svg/1f4a3.svg" data-marp-twemoji=""/> Slide 8: Tội Đồ #2 — Lạm Dụng Subagent Để Đếm Ký Tự</h2>
<h3 id="th%E1%BB%B1c-tr%E1%BA%A1ng-1">Thực trạng:</h3>
<ul>
<li>Rule cũ quy định: <em>Sau khi code xong, bắt buộc 100% phải gọi Subagent <code>Code Reviewer &amp; Risk Analyst</code></em>.</li>
<li>Kể cả một task đổi màu nút bấm, sửa 1 dòng CSS hay đổi 1 đoạn text label cũng phải kích hoạt Subagent!</li>
</ul>
<h3 id="h%E1%BA%ADu-qu%E1%BA%A3-v%E1%BB%81-chi-ph%C3%AD-1">Hậu quả về chi phí:</h3>
<ul>
<li>Khởi tạo Subagent nghĩa là tạo ra một phiên LLM mới:
<ul>
<li>Nạp lại System Prompt khổng lồ (~12.000 tokens).</li>
<li>Nạp toàn bộ git diff và các file liên quan (~15.000 tokens).</li>
<li>Subagent đọc từng dòng chỉ để kiểm tra: <em>Dòng này có quá 120 ký tự không? Thẻ <code>&lt;type&gt;</code> có thẻ <code>&lt;/type&gt;</code> chưa?</em></li>
</ul>
</li>
<li><strong>Tiêu tốn từ 40.000 – 60.000 tokens</strong> và mất gần 1 phút chỉ để làm công việc của một chương trình linter cơ bản!</li>
</ul>

<h3 id="th%E1%BB%B1c-tr%E1%BA%A1ng-2">Thực trạng:</h3>

<li>Khi hoàn thành code và test, AI tự động thực thi chuỗi lệnh quản trị Git:

<li><code>git status -s</code> (Turn 18)</li>
<li><code>git diff</code> (Turn 19 — in ra hàng trăm dòng diff vào context)</li>
<li><code>git add &lt;files&gt;</code> (Turn 20)</li>
<li><code>git commit -m &quot;...&quot;</code> (Turn 21)</li>
<li><code>git push origin &lt;branch&gt;</code> (Turn 22)</li>
</ol>
</li>
</ul>

<li>Đã có <strong>điều kiện đầu ra</strong> rõ ràng chưa? (Hành vi mong muốn sau khi sửa?)</li>
<li>Đã có <strong>ngữ cảnh tối thiểu</strong> chưa? (Mã issue, màn hình xảy ra lỗi, file nghi vấn?)</li>

<blockquote>
<p><span class="accent">Nguyên lý vàng trong AI Engineering</span>: <strong>Việc gì có thể giải quyết bằng Script và Thuật toán thì TUYỆT ĐỐI KHÔNG dùng LLM!</strong></p>

<h3 id="x%C3%A2y-d%E1%BB%B1ng-skill-adam-code-linter">Xây dựng Skill <code>adam-code-linter</code>:</h3>
<ul>

<p>Không phải task nào cũng cần gọi Subagent tốn kém. Chúng ta phân định rủi ro rõ ràng qua <strong>Ma Trận <code>adam-code-review</code></strong>:</p>

<ul>
<li>Constructor backward compatibility (<code>?TypeInterface $param = null</code>).</li>
<li>Chống SQL Injection (<code>quoteInto</code>), chặn N+1 query trong loop.</li>
<li>Extension Attributes không gọi <code>getData/setData</code>.</li>
<li>Không để catch rỗng (<code>Empty catch block</code>).</li>
</ul>
</li>

</ul>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-bash">git add app/code/Magestore/WebposFixBug/Model/Payment/Processor.php

<li>Trước khi xuất file <code>walkthrough.md</code>, AI nhắc bạn gõ <code>/compact</code> để dọn sạch context.<br />

<ol>
<li><strong>Chuyển Hóa Rules Thành Skills (Lazy Loading)</strong>:
<ul>

</li>
